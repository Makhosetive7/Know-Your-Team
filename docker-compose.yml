services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kyt
      POSTGRES_PASSWORD: kyt
      POSTGRES_DB: kyt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyt -d kyt"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - kyt_pgdata:/var/lib/postgresql/data

volumes:
  kyt_pgdata:
